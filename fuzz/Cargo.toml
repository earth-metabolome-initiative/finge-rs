[package]
name = "finge-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
rand_chacha = { version = "0.3", default-features = false }
smiles-parser = { git = "https://github.com/earth-metabolome-initiative/smiles-parser", branch = "main", default-features = false }
smarts_rs = { git = "https://github.com/earth-metabolome-initiative/smarts-rs", rev = "4545f4702115c0a92df2b2761545faf9b0a8191b", package = "smarts-rs", default-features = false }

[dependencies.finge-rs]
path = ".."
features = ["smiles-support", "smarts-support"]

[[bin]]
name = "ecfp"
path = "fuzz_targets/ecfp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "atom_pair"
path = "fuzz_targets/atom_pair.rs"
test = false
doc = false
bench = false

[[bin]]
name = "topological_torsion"
path = "fuzz_targets/topological_torsion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "maccs"
path = "fuzz_targets/maccs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mutator_atomic_number"
path = "fuzz_targets/mutator_atomic_number.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mutator_hypervalent"
path = "fuzz_targets/mutator_hypervalent.rs"
test = false
doc = false
