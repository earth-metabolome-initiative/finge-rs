[[bin]]
name = "mutator_isotope"
path = "fuzz_targets/mutator_isotope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mutator_ring_flag"
path = "fuzz_targets/mutator_ring_flag.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mutator_bond_type"
path = "fuzz_targets/mutator_bond_type.rs"
