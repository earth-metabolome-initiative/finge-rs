[package]
name = "finge-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Trait-first no_std molecular fingerprints"
readme = "README.md"
rust-version = "1.86"
repository = "https://github.com/earth-metabolome-initiative/finge-rs"
homepage = "https://github.com/earth-metabolome-initiative/finge-rs"

[features]
default = []
datasets = ["smiles-parser/datasets"]
smarts-support = ["dep:smarts_rs"]
# Bridges the LSH index to the `bhtsne` t-SNE via a kNN graph. Pulls in `std`.
tsne = ["dep:bhtsne", "dep:num-traits"]

[dependencies]
bhtsne = { version = "0.7.9", optional = true }
bitvec = { version = "1.0.1", default-features = false, features = ["alloc"] }
elements_rs = "0.2.7"
geometric-traits = { git = "https://github.com/earth-metabolome-initiative/geometric-traits", branch = "main", default-features = false, features = ["alloc"] }
minhash-rs = "0.3.0"
num-traits = { version = "0.2", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false }
smarts_rs = { git = "https://github.com/earth-metabolome-initiative/smarts-rs", rev = "4545f4702115c0a92df2b2761545faf9b0a8191b", package = "smarts-rs", default-features = false, optional = true }
smiles-parser = { git = "https://github.com/earth-metabolome-initiative/smiles-parser", branch = "main", default-features = false }

[dev-dependencies]
criterion = "=0.8.2"
flate2 = "1.1.9"
indicatif = "0.18.4"
proptest = "1"
rand_chacha = { version = "0.3", default-features = false }
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smiles-parser = { git = "https://github.com/earth-metabolome-initiative/smiles-parser", branch = "main", default-features = false, features = ["datasets"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[[bench]]
name = "ecfp"
harness = false

[[example]]
name = "compare_rdkit_pubchem_npz"

[[bench]]
name = "atom_pair"
harness = false

[[bench]]
name = "topological_torsion"
harness = false

[[bench]]
name = "rdk"
harness = false

[[bench]]
name = "maccs"
harness = false
required-features = ["smarts-support"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true
